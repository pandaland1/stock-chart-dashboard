name: Update market data and deploy Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      full_refresh:
        description: "QQQ 전체 이력 무결성 재수집"
        required: false
        type: boolean
        default: false
  schedule:
    - cron: "20 16 * * 1-5"
      timezone: "America/New_York"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    name: Test and build static site
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt

      - name: Run unit tests
        run: |
          python -m pytest -q
          node --test tests/chart_utils.test.js

      - name: Restore newest deployed market data
        run: python -m src.sync_deployed_data

      - name: Generate daily market data
        if: github.event_name != 'push'
        env:
          MARKET_LENS_FULL_REFRESH: ${{ inputs.full_refresh == true && '1' || '0' }}
        run: python -m src.main

      - name: Validate generated JSON
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          data_dir = Path("site/data")
          summaries = json.loads((data_dir / "stocks.json").read_text(encoding="utf-8"))
          successful = [item for item in summaries if item["updateStatus"] == "success"]
          if not successful:
              raise SystemExit("성공적으로 갱신된 종목이 없습니다.")
          for item in summaries:
              if item["dataPath"]:
                  path = data_dir / f"{item['symbol']}.json"
                  records = json.loads(path.read_text(encoding="utf-8"))
                  if not records:
                      raise SystemExit(f"{path}가 비어 있습니다.")
                  dates = [record["time"] for record in records]
                  if dates != sorted(set(dates)):
                      raise SystemExit(f"{path} 날짜가 오름차순 고유값이 아닙니다.")
                  if any(float(record["close"]) <= 0 for record in records):
                      raise SystemExit(f"{path}에 0 이하 종가가 있습니다.")

          metadata = json.loads((data_dir / "metadata.json").read_text(encoding="utf-8"))
          sentiment_path = data_dir / "sentiment" / "fear-greed.json"
          analytics_path = data_dir / "sentiment" / "analytics.json"
          sentiment = json.loads(sentiment_path.read_text(encoding="utf-8"))
          analytics = json.loads(analytics_path.read_text(encoding="utf-8"))
          sentiment_records = sentiment["records"]
          sentiment_dates = [record["time"] for record in sentiment_records]
          if sentiment_dates != sorted(set(sentiment_dates)):
              raise SystemExit("Fear & Greed 날짜가 오름차순 고유값이 아닙니다.")
          if any(not 0 <= float(record["value"]) <= 100 for record in sentiment_records):
              raise SystemExit("Fear & Greed 값이 0~100 범위를 벗어났습니다.")
          if not metadata.get("dataVersion") or not analytics.get("commonPeriod"):
              raise SystemExit("데이터 버전 또는 Sentiment 공통 기간이 없습니다.")
          print(
              f"JSON 검증 완료: 종목 {len(successful)}개, "
              f"Fear & Greed {len(sentiment_records)}건"
          )
          PY

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./site

  deploy:
    name: Deploy GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy artifact
        id: deployment
        uses: actions/deploy-pages@v4
