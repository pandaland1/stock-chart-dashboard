name: Update market data and deploy Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:
  schedule:
    - cron: "17 23 * * 1-5"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    name: Test and build static site
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt

      - name: Run unit tests
        run: python -m pytest -q

      - name: Restore newest deployed market data
        run: python -m src.sync_deployed_data

      - name: Generate daily market data
        if: github.event_name != 'push'
        run: python -m src.main

      - name: Validate generated JSON
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          data_dir = Path("site/data")
          summaries = json.loads((data_dir / "stocks.json").read_text(encoding="utf-8"))
          successful = [item for item in summaries if item["updateStatus"] == "success"]
          if not successful:
              raise SystemExit("성공적으로 갱신된 종목이 없습니다.")
          for item in summaries:
              if item["dataPath"]:
                  path = data_dir / f"{item['symbol']}.json"
                  records = json.loads(path.read_text(encoding="utf-8"))
                  if not records:
                      raise SystemExit(f"{path}가 비어 있습니다.")
          print(f"JSON 검증 완료: 사용 가능 {len(successful)}개")
          PY

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./site

  deploy:
    name: Deploy GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy artifact
        id: deployment
        uses: actions/deploy-pages@v4
